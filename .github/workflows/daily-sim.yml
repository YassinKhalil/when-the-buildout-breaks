name: daily-sim
# Nightly: pull live SPY/SMH/option and FRED data, run 10,000 Monte Carlo draws of Models D and F, and commit the
# refreshed public/data/latest_run.json and historical_risk.csv. The VPS timer (deploy/ai-bust-sync.*) picks the commit up.
on:
  schedule:
    - cron: "40 22 * * 1-5"      # 22:40 UTC, Mon-Fri: after the US close in both summer and winter time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-sim
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_quant -v            # never publish numbers from a broken engine
      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}      # optional; without it the keyless FRED csv endpoint is used
        run: python scripts/run_pipeline.py
      - name: Commit refreshed data
        run: |
          git config user.name  "daily-sim[bot]"
          git config user.email "daily-sim[bot]@users.noreply.github.com"
          git add public/data/latest_run.json public/data/historical_risk.csv
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Nightly simulation $(date -u +%F)"
          git pull --rebase --autostash
          git push
